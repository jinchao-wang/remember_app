name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build remember_app Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preserve custom source
        run: |
          mkdir -p /tmp/remember_src
          cp -r lib/. /tmp/remember_src/

      - name: Scaffold missing platform folders
        run: flutter create --platforms=android --project-name remember_app --org com.example .

      - name: Restore custom source
        run: |
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/remember_src/. lib/

      - name: Update compileSdk to 35
        run: |
          sed -i 's/compileSdk = 34/compileSdk = 35/' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 && code=0 || code=$?
          cat analyze.txt
          # 把分析结果转成 GitHub annotation，这样报错会直接显示在提交/PR 页面，
          # 不必翻日志（step log 只有仓库管理员能下）。
          while IFS= read -r line; do
            echo "::error::${line}"
          done < <(grep -E '^[[:space:]]+(error|warning)' analyze.txt || true)
          exit $code

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remember-app-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
