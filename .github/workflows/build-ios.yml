name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build remember_app iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Preserve custom source
        run: |
          mkdir -p /tmp/remember_src
          cp -r lib/. /tmp/remember_src/

      - name: Scaffold missing platform folders
        run: flutter create --platforms=ios --project-name remember_app --org com.example .

      - name: Restore custom source
        run: |
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/remember_src/. lib/

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 && code=0 || code=$?
          cat analyze.txt
          msg=$(tail -c 3000 analyze.txt | tr '\n\r' '  ' | sed 's/%/%25/g')
          echo "::error title=flutter analyze::${msg}"
          exit $code

      - name: Test
        run: |
          flutter test > test.txt 2>&1 && code=0 || code=$?
          cat test.txt
          msg=$(tail -c 3000 test.txt | tr '\n\r' '  ' | sed 's/%/%25/g')
          echo "::error title=flutter test::${msg}"
          exit $code

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry remember-app-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: remember-app-unsigned-ipa
          path: build/ios/ipa/remember-app-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
